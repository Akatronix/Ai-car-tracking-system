{% extends "base.html" %} {% set page = "alerts" %} {% block title %}Alerts{%
endblock %} {% block page_title %}Alert Management{% endblock %} {% block
content %}
<div class="alert-controls">
  <div class="alert-filter-tabs">
    <button class="filter-tab active" onclick="filtA('all', this)">All</button>
    <button class="filter-tab" onclick="filtA('critical', this)">
      Critical
    </button>
    <button class="filter-tab" onclick="filtA('warning', this)">Warning</button>
    <button class="filter-tab" onclick="filtA('info', this)">Info</button>
    <button class="filter-tab" onclick="filtA('unack', this)">
      Unacknowledged
    </button>
  </div>
  <button class="btn" onclick="ackAll()">Acknowledge All</button>
</div>
<div class="alerts-full-list" id="alertsList">
  <div class="empty-state"><p>Loading...</p></div>
</div>
{% endblock %} {% block extra_scripts %}
<script>
  let curFilt = "all";
  function loadA() {
    fetch("/api/alerts?limit=100")
      .then((r) => r.json())
      .then((alerts) => {
        let f = alerts;
        if (curFilt === "unack") f = alerts.filter((a) => !a.acknowledged);
        else if (curFilt !== "all")
          f = alerts.filter((a) => a.severity === curFilt);
        const el = document.getElementById("alertsList");
        if (!f.length) {
          el.innerHTML =
            '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><p>No alerts</p></div>';
          return;
        }
        el.innerHTML = f
          .map(
            (a) => `
            <div class="alert-card severity-${a.severity} ${a.acknowledged ? "acknowledged" : ""}">
                <div class="alert-card-left">
                    <div class="alert-severity-icon">${a.severity === "critical" ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>' : a.severity === "warning" ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'}</div>
                    <div><div class="alert-card-type">${a.alert_type.replace(/_/g, " ").toUpperCase()}</div><div class="alert-card-msg">${a.message}</div><div class="alert-card-time">${formatTime(a.timestamp)}</div></div>
                </div>
                <div class="alert-card-right">${!a.acknowledged ? `<button class="btn btn-sm btn-ghost" onclick="ackOne(${a.id},this)">Acknowledge</button>` : '<span class="badge success">Done</span>'}</div>
            </div>`,
          )
          .join("");
      });
  }
  function filtA(f, btn) {
    curFilt = f;
    document
      .querySelectorAll(".filter-tab")
      .forEach((t) => t.classList.remove("active"));
    btn.classList.add("active");
    loadA();
  }
  function ackOne(id, btn) {
    fetch(`/api/alerts/${id}/ack`, { method: "POST" }).then(() => {
      btn.closest(".alert-card").classList.add("acknowledged");
      btn.closest(".alert-card-right").innerHTML =
        '<span class="badge success">Done</span>';
      updateBadge();
    });
  }
  function ackAll() {
    fetch("/api/alerts?limit=1000")
      .then((r) => r.json())
      .then((a) => {
        const u = a.filter((x) => !x.acknowledged);
        Promise.all(
          u.map((x) => fetch(`/api/alerts/${x.id}/ack`, { method: "POST" })),
        ).then(() => {
          loadA();
          updateBadge();
          showToast(`Acknowledged ${u.length} alerts`, "success");
        });
      });
  }
  function updateBadge() {
    fetch("/api/status")
      .then((r) => r.json())
      .then((d) => {
        const b = document.getElementById("alertBadge");
        if (d.unacknowledged_alerts > 0) {
          b.style.display = "inline-flex";
          b.textContent = d.unacknowledged_alerts;
        } else b.style.display = "none";
      });
  }
  document.addEventListener("DOMContentLoaded", loadA);
</script>
{% endblock %}
